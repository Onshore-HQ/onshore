name: onshore

# Every service gets only the secrets it needs, and only the networks it needs.
# edge -> app network -> services; only vault-api reaches the key service.

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  read_only: true
  tmpfs: ["/tmp"]

x-build-go: &go-args
  LICENCE_PUBLIC_KEY: "${RV_LICENCE_PUBLIC_KEY:-}"

services:
  edge:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["${RV_HTTPS_PORT:-443}:443"]
    environment:
      RV_HOST: ${RV_HOST:-localhost}
      RV_TLS: ${RV_TLS:-internal}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - ./internal-tls/edge:/tls:ro
      - caddydata:/data
    networks:
      app:
        aliases: ["${RV_HOST:-localhost}"]
      public: {}
    depends_on: [vault-api, console, control-api]

  vault-api:
    <<: *hardening
    image: ${RV_REGISTRY:-rv}/vault-api:${RV_VERSION:-dev}
    build: { context: ../.., dockerfile: deploy/docker/data-plane.Dockerfile, target: vault-api, args: *go-args }
    networks: [app, db, keys]
    volumes: ["./internal-tls/vault-api:/tls:ro"]
    environment:
      RV_ENV: ${RV_ENV:-production}
      KEY_BACKEND: ${KEY_BACKEND:-openbao}   # pkcs11 for a bank HSM is on the roadmap
      OPENBAO_ADDR: https://keys:8200
      OPENBAO_CACERT: /tls/ca.pem
      OPENBAO_TOKEN: ${OPENBAO_TOKEN:-}
      DATABASE_URL: postgres://rv_vault:${RV_VAULT_DB_PASSWORD}@postgres:5432/rv?sslmode=verify-full&sslrootcert=/tls/ca.pem
      RV_TRUSTED_PROXIES: 172.30.0.0/24
      RV_INTERNAL_TOKEN: ${RV_INTERNAL_TOKEN}
      RV_TOKEN_SIGNING_SEED: ${RV_TOKEN_SIGNING_SEED}
      RV_USER_TOKEN_PUBLIC_KEY: ${RV_USER_TOKEN_PUBLIC_KEY}
      RV_LICENCE: ${RV_LICENCE:-}
      RV_GEOIP_CSV: ${RV_GEOIP_CSV:-}
      RV_TLS_CERT: /tls/cert.pem
      RV_TLS_KEY: /tls/key.pem
      RV_TLS_CLIENT_CA: /tls/ca.pem
      # Language-model detection (paid): https://nlp:8095 with --profile nlp.
      RV_NLP_URL: ${RV_NLP_URL:-}
    depends_on:
      migrate: { condition: service_completed_successfully }

  control-api:
    <<: *hardening
    image: ${RV_REGISTRY:-rv}/control-api:${RV_VERSION:-dev}
    build: { context: ../.., dockerfile: deploy/docker/control-api.Dockerfile }
    # egress: SSO token exchange and SIEM delivery, which check for public addresses, and
    # email, which may use a private mail server but never this installation's own networks.
    networks: [app, db, egress]
    volumes: ["./internal-tls/control-api:/tls:ro"]
    environment:
      DATABASE_URL: postgres://rv_control:${RV_CONTROL_DB_PASSWORD}@postgres:5432/rv
      DATABASE_CA: /tls/ca.pem
      VAULT_INTERNAL_URL: https://vault-api:8080
      RV_TRUSTED_PROXIES: 172.30.0.0/24
      RV_HOST: ${RV_HOST:-localhost}
      RV_COUNTRY: ${RV_COUNTRY:-}
      RV_CLOUD: ${RV_CLOUD:-}
      RV_CLOUD_REGIONS: ${RV_CLOUD_REGIONS:-}
      RV_PRIMARY_URL: ${RV_PRIMARY_URL:-}
      RV_JOIN_CODE: ${RV_JOIN_CODE:-}
      RV_PUBLIC_PORT: ${RV_PUBLIC_PORT:-}
      RV_INTERNAL_TOKEN: ${RV_INTERNAL_TOKEN}
      RV_USER_TOKEN_SEED: ${RV_USER_TOKEN_SEED}
      RV_SESSION_IDLE_MINUTES: ${RV_SESSION_IDLE_MINUTES:-15}
      RV_CONTROL_SECRET: ${RV_CONTROL_SECRET}
      RV_ADAPTER_SECRET: ${RV_ADAPTER_SECRET}
      RV_BOOTSTRAP_TOKEN: ${RV_BOOTSTRAP_TOKEN}
      RV_TLS_CERT: /tls/cert.pem
      RV_TLS_KEY: /tls/key.pem
      RV_TLS_CA: /tls/ca.pem
    depends_on:
      migrate: { condition: service_completed_successfully }

  console:
    <<: *hardening
    image: ${RV_REGISTRY:-rv}/console:${RV_VERSION:-dev}
    build: { context: ../.., dockerfile: deploy/docker/console.Dockerfile }
    networks: [app]
    tmpfs: ["/tmp", "/app/.next/cache"]
    volumes: ["./internal-tls/console:/tls:ro"]
    environment:
      CONTROL_API_URL: https://control-api:8081
      VAULT_API_URL: https://vault-api:8080
      FILES_URL: https://file-redactor:8094
      RV_TLS_CERT: /tls/cert.pem
      RV_TLS_KEY: /tls/key.pem
      RV_TLS_CA: /tls/ca.pem

  migrate:
    image: ${RV_REGISTRY:-rv}/tools:${RV_VERSION:-dev}
    build: { context: ../.., dockerfile: deploy/docker/data-plane.Dockerfile, target: tools, args: *go-args }
    restart: "no"
    command: ["migrate"]
    networks: [db]
    volumes: ["./internal-tls/tools:/tls:ro"]
    environment:
      DATABASE_URL: postgres://rv:${DB_PASSWORD}@postgres:5432/rv?sslmode=verify-full&sslrootcert=/tls/ca.pem
      RV_VAULT_DB_PASSWORD: ${RV_VAULT_DB_PASSWORD}
      RV_CONTROL_DB_PASSWORD: ${RV_CONTROL_DB_PASSWORD}
      RV_LICENCE: ${RV_LICENCE:-}
    depends_on:
      postgres: { condition: service_healthy }

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [db]
    # The key file must be owned by postgres, which a bind mount cannot promise.
    entrypoint: ["sh", "-c", "install -d -o postgres -g postgres -m 700 /run/rv-tls && install -o postgres -g postgres -m 600 /tls/key.pem /run/rv-tls/key.pem && install -o postgres -g postgres -m 644 /tls/cert.pem /run/rv-tls/cert.pem && exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/run/rv-tls/cert.pem -c ssl_key_file=/run/rv-tls/key.pem -c ssl_min_protocol_version=TLSv1.3 -c hba_file=/etc/rv/pg_hba.conf"]
    environment:
      POSTGRES_USER: rv
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: rv
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./internal-tls/postgres:/tls:ro
      - ./pg_hba.conf:/etc/rv/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rv -d rv"]
      interval: 3s
      timeout: 3s
      retries: 30

  keys:
    image: openbao/openbao:2.4
    restart: unless-stopped
    networks: [keys]
    command: ["server", "-config=/etc/openbao/openbao.hcl"]
    volumes:
      - ./openbao.hcl:/etc/openbao/openbao.hcl:ro
      - ./internal-tls/keys:/tls:ro
      - keydata:/openbao/file

  log-processor:
    <<: *hardening
    profiles: ["logs"]
    image: ${RV_REGISTRY:-rv}/log-processor:${RV_VERSION:-dev}
    build: { context: ../.., dockerfile: deploy/docker/data-plane.Dockerfile, target: log-processor, args: *go-args }
    networks: [app, db, egress]
    volumes: ["./internal-tls/log-processor:/tls:ro"]
    environment:
      DATABASE_URL: postgres://rv_vault:${RV_VAULT_DB_PASSWORD}@postgres:5432/rv?sslmode=verify-full&sslrootcert=/tls/ca.pem
      VAULT_INTERNAL_URL: https://vault-api:8080
      RV_INTERNAL_TOKEN: ${RV_INTERNAL_TOKEN}
      RV_TLS_CERT: /tls/cert.pem
      RV_TLS_KEY: /tls/key.pem
      RV_TLS_CLIENT_CA: /tls/ca.pem
      # Language-model detection (paid): https://nlp:8095 with --profile nlp.
      RV_NLP_URL: ${RV_NLP_URL:-}
    depends_on:
      migrate: { condition: service_completed_successfully }

  ai-gateway:
    <<: *hardening
    profiles: ["ai"]
    image: ${RV_REGISTRY:-rv}/ai-gateway:${RV_VERSION:-dev}
    build: { context: ../.., dockerfile: deploy/docker/data-plane.Dockerfile, target: ai-gateway, args: *go-args }
    networks: [app, db, egress]
    volumes: ["./internal-tls/ai-gateway:/tls:ro"]
    environment:
      DATABASE_URL: postgres://rv_vault:${RV_VAULT_DB_PASSWORD}@postgres:5432/rv?sslmode=verify-full&sslrootcert=/tls/ca.pem
      VAULT_INTERNAL_URL: https://vault-api:8080
      RV_INTERNAL_TOKEN: ${RV_INTERNAL_TOKEN}
      RV_TLS_CERT: /tls/cert.pem
      RV_TLS_KEY: /tls/key.pem
      RV_TLS_CLIENT_CA: /tls/ca.pem
      # Language-model detection (paid): https://nlp:8095 with --profile nlp.
      RV_NLP_URL: ${RV_NLP_URL:-}
    depends_on:
      migrate: { condition: service_completed_successfully }

  http-proxy:
    <<: *hardening
    profiles: ["proxy"]
    image: ${RV_REGISTRY:-rv}/http-proxy:${RV_VERSION:-dev}
    build: { context: ../.., dockerfile: deploy/docker/data-plane.Dockerfile, target: http-proxy, args: *go-args }
    networks: [app, db, egress]
    volumes: ["./internal-tls/http-proxy:/tls:ro"]
    environment:
      DATABASE_URL: postgres://rv_vault:${RV_VAULT_DB_PASSWORD}@postgres:5432/rv?sslmode=verify-full&sslrootcert=/tls/ca.pem
      VAULT_INTERNAL_URL: https://vault-api:8080
      RV_FILE_REDACTOR_URL: https://file-redactor:8094
      RV_INTERNAL_TOKEN: ${RV_INTERNAL_TOKEN}
      RV_TLS_CERT: /tls/cert.pem
      RV_TLS_KEY: /tls/key.pem
      RV_TLS_CLIENT_CA: /tls/ca.pem
      # Language-model detection (paid): https://nlp:8095 with --profile nlp.
      RV_NLP_URL: ${RV_NLP_URL:-}
    depends_on:
      migrate: { condition: service_completed_successfully }

  adapters:
    <<: *hardening
    profiles: ["adapters"]
    image: ${RV_REGISTRY:-rv}/adapters:${RV_VERSION:-dev}
    build: { context: ../.., dockerfile: deploy/docker/data-plane.Dockerfile, target: adapters, args: *go-args }
    networks: [app, db, egress]
    volumes: ["./internal-tls/adapters:/tls:ro"]
    environment:
      DATABASE_URL: postgres://rv_vault:${RV_VAULT_DB_PASSWORD}@postgres:5432/rv?sslmode=verify-full&sslrootcert=/tls/ca.pem
      VAULT_INTERNAL_URL: https://vault-api:8080
      RV_INTERNAL_TOKEN: ${RV_INTERNAL_TOKEN}
      RV_ADAPTER_SECRET: ${RV_ADAPTER_SECRET}
      RV_TLS_CERT: /tls/cert.pem
      RV_TLS_KEY: /tls/key.pem
      RV_TLS_CLIENT_CA: /tls/ca.pem
      # Language-model detection (paid): https://nlp:8095 with --profile nlp.
      RV_NLP_URL: ${RV_NLP_URL:-}
    depends_on:
      migrate: { condition: service_completed_successfully }

  # No database, key service or outbound network: it handles untrusted files.
  file-redactor:
    <<: *hardening
    profiles: ["files"]
    image: ${RV_REGISTRY:-rv}/file-redactor:${RV_VERSION:-dev}
    build: { context: ../.., dockerfile: deploy/docker/data-plane.Dockerfile, target: file-redactor, args: *go-args }
    networks: [app]
    tmpfs: ["/tmp:size=2g"]
    pids_limit: 256
    mem_limit: 4g
    volumes: ["./internal-tls/file-redactor:/tls:ro"]
    environment:
      VAULT_INTERNAL_URL: https://vault-api:8080
      RV_INTERNAL_TOKEN: ${RV_INTERNAL_TOKEN}
      RV_TLS_CERT: /tls/cert.pem
      RV_TLS_KEY: /tls/key.pem
      RV_TLS_CLIENT_CA: /tls/ca.pem
      # Language-model detection (paid): https://nlp:8095 with --profile nlp.
      RV_NLP_URL: ${RV_NLP_URL:-}

  # Language models for detection (paid; --profile nlp): spaCy by default, or
  # transformers or Stanza with RV_NLP_ENGINE at build time. Only the detection
  # services reach it, over mutual TLS, and it has no outbound network.
  nlp:
    <<: *hardening
    profiles: ["nlp"]
    image: ${RV_REGISTRY:-rv}/nlp:${RV_VERSION:-dev}
    build:
      context: ../..
      dockerfile: deploy/docker/nlp.Dockerfile
      args: { ENGINE: "${RV_NLP_ENGINE:-spacy}", MODEL: "${RV_NLP_MODEL:-}" }
    networks: [app]
    tmpfs: ["/tmp:size=512m"]
    mem_limit: ${RV_NLP_MEMORY:-4g}
    volumes: ["./internal-tls/nlp:/tls:ro"]
    environment:
      RV_TLS_CERT: /tls/cert.pem
      RV_TLS_KEY: /tls/key.pem
      RV_TLS_CLIENT_CA: /tls/ca.pem

  # Run through ./rv: `./rv keys init`, `./rv doctor`, `./rv scan file.log`.
  tools:
    profiles: ["tools"]
    image: ${RV_REGISTRY:-rv}/tools:${RV_VERSION:-dev}
    build: { context: ../.., dockerfile: deploy/docker/data-plane.Dockerfile, target: tools, args: *go-args }
    networks: [app, keys]
    environment:
      OPENBAO_ADDR: https://keys:8200
      OPENBAO_CACERT: /work/internal-tls/tools/ca.pem
    volumes: [".:/work"]

  # ---- Observability (optional): docker compose --profile observability up -d ----
  # Loki keeps every service's logs, Alloy collects them, Prometheus keeps Onshore's
  # metrics, and Grafana shows both at https://<host>/grafana/. Everything stays on
  # this host. Logs never hold a stored value: services log what happened, not data.
  docker-socket-proxy:
    profiles: ["observability"]
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    environment:
      # Read-only: list containers and networks and read logs. Everything else is refused.
      CONTAINERS: 1
      NETWORKS: 1
      POST: 0
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]
    networks: [obs]

  loki:
    profiles: ["observability"]
    image: grafana/loki:3.4.2
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    command: ["-config.file=/etc/loki/loki.yaml", "-config.expand-env=true"]
    environment:
      RV_LOG_RETENTION: ${RV_LOG_RETENTION:-720h}
    volumes:
      - ./observability/loki.yaml:/etc/loki/loki.yaml:ro
      - lokidata:/loki
    networks: [obs]

  alloy:
    profiles: ["observability"]
    image: grafana/alloy:v1.7.5
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data", "--disable-reporting", "/etc/alloy/config.alloy"]
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-onshore}
      RV_HOST: ${RV_HOST:-localhost}
    volumes:
      - ./observability/alloy.alloy:/etc/alloy/config.alloy:ro
      - alloydata:/var/lib/alloy/data
    networks: [obs]
    depends_on: [loki, docker-socket-proxy]

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.2.1
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["/bin/sh", "/etc/prometheus/start.sh"]
    environment:
      RV_HOST: ${RV_HOST:-localhost}
      RV_METRICS_KEY: ${RV_METRICS_KEY:-}
      RV_METRICS_RETENTION: ${RV_METRICS_RETENTION:-30d}
    volumes:
      - ./observability/prometheus-start.sh:/etc/prometheus/start.sh:ro
      - promdata:/prometheus
    # app: Onshore's metrics through the edge's internal listener. obs: Loki, Alloy, Grafana.
    networks: [app, obs]

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.5.2
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    # Refuses to start without an admin password: Grafana's default is "admin".
    entrypoint: ["/bin/sh", "-c", "[ -n \"$$GF_SECURITY_ADMIN_PASSWORD\" ] || { echo 'Set RV_GRAFANA_ADMIN_PASSWORD in .env'; exit 1; }; exec /run.sh"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${RV_GRAFANA_ADMIN_PASSWORD:-}
      GF_SERVER_ROOT_URL: https://${RV_HOST:-localhost}${RV_PUBLIC_PORT:+:${RV_PUBLIC_PORT}}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/onshore.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    networks: [app, obs]
    depends_on: [loki, prometheus]

networks:
  app:
    internal: true
    ipam:
      config: [{ subnet: 172.30.0.0/24 }]
  db:
    internal: true
  keys:
    internal: true
  public: {}
  egress: {}   # log destinations abroad; nothing else joins this network
  obs:
    internal: true   # observability: Loki, Alloy, Prometheus, Grafana

volumes:
  pgdata: {}
  keydata: {}
  caddydata: {}
  lokidata: {}
  alloydata: {}
  promdata: {}
  grafanadata: {}
