apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-{{ .Release.Revision }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migrate
          image: "{{ .Values.image.registry }}/tools:{{ .Values.image.tag }}"
          args: ["migrate"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          env:
            {{- include "rv.secret" (dict "root" . "key" "DATABASE_URL" "from" "RV_MIGRATE_DATABASE_URL") | nindent 12 }}
            {{- include "rv.secret" (dict "root" . "key" "RV_VAULT_DB_PASSWORD") | nindent 12 }}
            {{- include "rv.secret" (dict "root" . "key" "RV_CONTROL_DB_PASSWORD") | nindent 12 }}
            {{- include "rv.secret" (dict "root" . "key" "RV_LICENCE") | nindent 12 }}
          volumeMounts:
            - { name: tls, mountPath: /tls, readOnly: true }
      volumes:
        - name: tls
          secret:
            secretName: {{ .Values.internalTlsSecretPrefix }}-tools
